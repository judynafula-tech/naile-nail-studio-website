<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NAILÉ | Private Booking Viewer</title>

    <link rel="stylesheet" href="admin.css">
</head>

<body>

    <header class="admin-header">
        <h1>NAILÉ</h1>
        <p>PRIVATE BOOKING VIEWER</p>
    </header>

    <main class="admin-container">

        <section class="login-section" id="loginSection">

            <h2>Welcome Back</h2>
            <p>Sign in to view website bookings.</p>

            <form id="loginForm">

                <label for="adminEmail">Email Address</label>
                <input
                    type="email"
                    id="adminEmail"
                    required
                >

                <label for="adminPassword">Password</label>
                <input
                    type="password"
                    id="adminPassword"
                    required
                >

                <button type="submit">Sign In</button>

                <p id="loginMessage"></p>

            </form>

        </section>

        <section class="bookings-section" id="bookingsSection" style="display: none;">

            <div class="bookings-heading">
                <div>
                    <h2>Your Website Bookings</h2>
                    <p>All bookings submitted through the NAILÉ website.</p>
                </div>

                <button id="logoutButton">Log Out</button>
            </div>

            <div class="booking-summary">
                <span>Total Website Bookings</span>
                <h2 id="totalBookings">0</h2>
            </div>

            <div id="bookingsList"></div>

        </section>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="admin.js"></script>

</body>
</html>
